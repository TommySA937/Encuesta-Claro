{% extends 'base.html' %}{% block title %}Crear cuenta · EncuestaCLARO{% endblock %}{% block content %}<main class="auth-wrap"><div class="container"><section class="card auth-card"><span class="eyebrow">Registro</span><h1>Crea tu cuenta</h1><p class="muted">Tendrás acceso a la creación y gestión de encuestas.</p><form method="post"><div class="form-group"><label>Nombre de usuario</label><input class="input" name="usuario" maxlength="50" required placeholder="Tu nombre"></div><div class="form-group"><label>Correo electrónico</label><input class="input" type="email" name="correo" required placeholder="nombre@correo.com"></div><div class="two-col"><div class="form-group"><label>Contraseña</label><input class="input" type="password" name="contrasena" minlength="6" required placeholder="Mínimo 6 caracteres"></div><div class="form-group"><label>Confirmar contraseña</label><input class="input" type="password" name="confirmar_contrasena" minlength="6" placeholder="Repite la contraseña"></div></div><button class="btn btn-primary btn-block" type="submit">Crear cuenta</button></form><p class="muted" style="text-align:center;margin-bottom:0">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p></section></div></main>{% endblock %}
